<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>

<h1>Get Department By Id</h1>

<input type="text" id="deptid">
<input type="button" onclick="loaddata()" value="click">

<div id="data"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script>

    function loaddata()
    {
        var id = document.querySelector("#deptid").value;

        var data = document.querySelector("#data");

        $.ajax({

            url: `http://localhost:5281/api/Department/${id}`,

            success: function(result)
            {
                data.innerHTML = result.name;
            },

            error: function(xhr)
            {
                data.innerHTML = "Department Not Found";
            }

        });
    }

</script>

</body>
</html>
